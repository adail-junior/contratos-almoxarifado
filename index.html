.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}

@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
.modal-bg{position:fixed;inset:0;background:rgba(8,14,12,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}

.modal.small{width:min(440px,100%)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
.drop{border:2px dashed var(--line);border-radius:8px;padding:28px;text-align:center;display:grid;gap:8px;justify-items:center}

.over{color:var(--bad);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.stat{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:3px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

.stat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.stat:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stat.alert b{color:var(--warn)}
.btn.wa{background:#1F8F4E;border-color:#1F8F4E;color:#fff}
.btn.wa:hover{filter:brightness(1.08)}

.box{border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:10px;background:var(--sunk)}

.box h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

@media (max-width:520px){.big{font-size:20px}.brand span{display:none}h1{font-size:25px}.kv{grid-template-columns:1fr 1fr}.doc{padding:14px}.doc-num{font-size:32px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}

<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>Contratos AW</b><span>Filial 0201 · Armazém 41</span></div>
    <nav class="tabs" id="tabs" aria-label="Seções">
      <button data-go="painel">Painel</button>
      <button data-go="saldo">Saldo do contrato</button>
      <button data-go="nova">Nova solicitação</button>
      <button data-go="solicitacoes">Solicitações</button>
      <button data-go="recebimentos">Recebimentos</button>
      <button data-go="importar">Importar ERP</button>
      <button data-go="ajustes">Ajustes</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main">
  <div class="panel empty">
    <h2>Carregando contratos…</h2>
    <p class="sub">Os pedidos de contrato, solicitações e recebimentos aparecem aqui assim que a base for lida.</p>
  </div>
</main>
<div id="modal-root"></div>
<div id="toast" hidden></div>

<script>
(() => {
'use strict';
// ---------- estado ----------
const S = {
  db: null, dl: null, ready: {contratos:false, solicitacoes:false, recebimentos:false, config:false, retorno:false},
  contratos: {}, sols: {}, topSols: {}, userSols: {}, ret: {}, recs: {}, config: {limiteParcelamento:20000, parcelas:6, emailCompras:'', ccCompras:'', emailAlmox:'', assinatura:'', categorias:['EPI','LIMPEZA']},
  role: 'admin', uid: null, marker: false, rtEdit: null,
  view: 'painel', param: null, M: null,
  saldoFiltro: {cat:'TODAS', pc:'TODOS', q:'', soSaldo:false},
  solFiltro: {st:'abertas', q:'', cat:'TODAS'}, draft: null, imp: null, pendingRender: false, readOnly: false,
};
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fQ = n => (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const fR = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fP = n => (Number(n)||0).toLocaleString('pt-BR',{style:'percent',maximumFractionDigits:0});
const r2 = n => Math.round((Number(n)||0)*10000)/10000;
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fD = s => { if(!s) return '—'; const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m? `${m[3]}/${m[2]}/${m[1]}` : String(s); };
const daysSince = s => { if(!s) return 0; const a=new Date(s+'T12:00:00'), b=new Date(today()+'T12:00:00'); return Math.round((b-a)/864e5); };
const pad4 = n => String(n).padStart(4,'0');
const key = (pc,cod) => pc+'|'+cod;
const shortForn = s => String(s||'').replace(/\s+(EIRELI|LTDA|EPP|ME|S\.?A\.?)\b.*$/i,'').trim() || s;
const parseNum = v => { if (v==null||v==='') return 0; if (typeof v==='number') return v; let s=String(v).replace(/R\$/g,'').replace(/ /g,'').trim(); if (s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=Number(s); return isFinite(n)?n:0; };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3200); }

// ---------- cálculo central ----------
function compute(){
  const items = {}, byPc = {};
  for (const c of Object.values(S.contratos)) {
    byPc[c.pc] = [];
    for (const it of (c.itens||[])) {
      const k = key(c.pc, it.cod);
      const row = {k, pc:c.pc, cat:c.categoria, forn:c.fornecedor, codForn:c.codFornecedor, cod:it.cod, desc:it.desc, un:it.un,
        qtd:Number(it.qtd)||0, vunit:Number(it.vunit)||0, erp:Number(it.atendidaErp)||0, recebido:0, pend:0, pendBy:{}};
      items[k] = row; byPc[c.pc].push(row);
    }
  }
  const recSol = {};
  for (const r of Object.values(S.recs)) for (const l of (r.itens||[])) {
    const k = key(l.pc,l.cod); if (items[k]) items[k].recebido += Number(l.qtd)||0;
    if (r.sol) { (recSol[r.sol] ||= {}); recSol[r.sol][k] = (recSol[r.sol][k]||0) + (Number(l.qtd)||0); }
  }
  const sols = Object.values(S.sols).map(s=>solView(s, items, recSol, true));
  sols.sort((a,b)=>b.num-a.num);
  for (const it of Object.values(items)) { it.disp = Math.max(0, r2(it.qtd - it.recebido - it.pend)); it.excesso = r2(it.recebido + it.pend - it.qtd); }
  S.M = {items, byPc, sols, recSol, solById: Object.fromEntries(sols.map(s=>[s.id,s]))};
}
const ADM = () => S.role==='admin';
function effStatus(s){ const r=S.ret[s.id]||{}; return s.autor ? (r.status||s.status) : s.status; }
function effEnviada(s){ const r=S.ret[s.id]||{}; return s.autor ? (r.enviadaEm||s.enviadaEm||null) : (s.enviadaEm||null); }
const numTxt = s => s && s.num ? pad4(s.num) : 'PRÉVIA';
// monta a visão calculada de uma solicitação (situação, recebido, falta, etapa de aviso)
function solView(s, items, recSol, reserva){
  const status = effStatus(s), ret = S.ret[s.id]||{};
  const ativa = ['rascunho','aguardando','enviada'].includes(status);
  let tot=0, totRec=0, totPend=0, qtdTot=0, qtdRec=0;
  const linhas = (s.itens||[]).map(l => {
    const k = key(l.pc,l.cod), it = items[k] || {desc:'(item fora do contrato)', un:'', vunit:0, forn:S.contratos[l.pc]?.fornecedor||'', codForn:''};
    const rec = Math.min(recSol[s.id]?.[k]||0, l.qtd);
    const pend = ativa ? Math.max(0, l.qtd - rec) : 0;
    if (reserva && ativa && items[k]) { items[k].pend += pend; items[k].pendBy[s.id] = pend; }
    tot += l.qtd*it.vunit; totRec += rec*it.vunit; totPend += pend*it.vunit; qtdTot += l.qtd; qtdRec += rec;
    return {...l, k, desc:it.desc, un:it.un, vunit:it.vunit, forn:it.forn, codForn:it.codForn, rec, pend, total:l.qtd*it.vunit};
  });
  const compras = ret.compras || null, avisos = ret.avisos || [];
  let st;
  if (status==='rascunho') st={t:'Rascunho',c:'p-draft',k:'envio'};
  else if (status==='cancelada') st={t:'Cancelada',c:'p-draft',k:'canceladas'};
  else if (qtdTot>0 && qtdRec>=qtdTot-1e-9) st={t:'Entregue',c:'p-ok',k:'entregues'};
  else if (status==='encerrada') st={t:'Encerrada c/ falta',c:'p-draft',k:'canceladas'};
  else if (status==='aguardando') st={t:'Aguardando envio ao Compras',c:'p-warn',k:'envio'};
  else if (qtdRec>0) st={t:'Entrega parcial',c:'p-warn',k:'caminho'};
  else if (compras) st={t:'Solicitada ao fornecedor',c:'p-acc',k:'caminho'};
  else st={t:'Aguardando retorno do Compras',c:'p-acc',k:'retorno'};
  let etapa=null;
  if (st.k==='entregues') etapa='entrega';
  else if (status==='enviada' && qtdRec>0) etapa='parcial';
  else if (status==='enviada' && compras) etapa='retorno';
  const contato = !!(s.email || s.zap);
  const faltaAvisar = !!etapa && contato && !avisos.some(a=>a.etapa===etapa);
  return {...s, status, enviadaEm:effEnviada(s), ret, compras, avisos, linhas, tot, totRec, totPend, qtdTot, qtdRec, st, etapa, contato, faltaAvisar,
    aberta: ((status==='enviada'||status==='aguardando') && totPend>0.0001) || status==='rascunho'};
}
function contratoTotals(pc){
  const rows = S.M.byPc[pc]||[]; let v=0,vr=0,vp=0,vd=0,div=0;
  for (const it of rows){ v+=it.qtd*it.vunit; vr+=Math.min(it.recebido,it.qtd)*it.vunit; vp+=it.pend*it.vunit; vd+=it.disp*it.vunit; if (Math.abs(it.erp-it.recebido)>1e-9) div++; }
  return {v,vr,vp,vd,div,n:rows.length, comSaldo: rows.filter(r=>r.disp>0).length};
}
function categorias(){ const set=new Set(S.config.categorias||[]); Object.values(S.contratos).forEach(c=>set.add(c.categoria)); return [...set]; }
// numeração única entre todos os usuários (trava curta no documento seq/sol)
async function nextSeq(){
  const localMax=Math.max(0,...Object.values(S.sols).map(s=>Number(s.num)||0));
  if (window.__proximoNumero) { try { return await window.__proximoNumero(localMax+1); } catch(e){ console.warn('numeração', e); } }
  const ref=S.db.doc('seq/sol'); const holder='h'+Math.random().toString(36).slice(2)+Date.now().toString(36);
  for (let i=0;i<20;i++){
    let r=null; try{ r=await ref.acquire({holder, ttlMs:4000}); }catch(e){ r=null; }
    if (!r) break;
    if (r.acquired){ const snap=await ref.get(); const last=snap.exists?(Number(snap.data().ultimo)||0):0; const n=Math.max(last,localMax)+1; await ref.set({ultimo:n, em:Date.now()}); return n; }
    await new Promise(res=>setTimeout(res,250+Math.random()*400));
  }
  return localMax+1;
}
function condPag(total){
  const lim=Number(S.config.limiteParcelamento)||0, n=Number(S.config.parcelas)||1;
  if (!total) return '—';
  return (lim && total>lim) ? `Parcelado em ${n}x de ${fR(total/n)}` : 'À vista / condição padrão';
}

// ---------- persistência ----------
async function write(col, id, data){
  if (!S.db) { toast('Base indisponível nesta visualização.'); throw new Error('no-db'); }
  return setRef(S.db.collection(col).doc(id), data);
}
async function setRef(ref, data){
  try { await ref.set(JSON.parse(JSON.stringify(data))); }
  catch(e){
    if (e && e.code==='invalid_argument') { if (!ADM()) { S.role='viewer'; applyRole(); render(true); } toast('Você não tem permissão para essa alteração.'); }
    else if (e && e.code==='quota_exceeded') toast('Limite da base atingido: '+(e.message||''));
    else toast('Não foi possível salvar. Tente de novo.');
    throw e;
  }
}
const REFS={}, USERSUB={};
function solRef(id){ return REFS[id] || S.db.collection('solicitacoes').doc(id); }
async function setStatus(id, status, extra={}){
  const s=S.sols[id]; if(!s) return;
  if (s.autor){ await write('retorno', id, {...(S.ret[id]||{}), status, ...extra}); }
  else { const d={...s, status, ...extra}; delete d.id; delete d.autor; await setRef(solRef(id), d); }
}
async function patchRet(id, data){ await write('retorno', id, {...(S.ret[id]||{}), ...data}); }
async function delSol(id){ try{ await solRef(id).delete(); if (S.ret[id]) await S.db.collection('retorno').doc(id).delete(); }catch(e){ toast('Não foi possível excluir.'); throw e; } }
async function remove(col, id){ if (!S.db) return; try{ await S.db.collection(col).doc(id).delete(); }catch(e){ toast('Não foi possível excluir.'); throw e; } }

function applyRole(){

function render(force){

const FILTROS_SOL = [['abertas','Em aberto'],['envio','Aguardando envio'],['retorno','Aguardando Compras'],['caminho','A caminho'],['entregues','Entregues'],['avisar','Falta avisar'],['canceladas','Canceladas'],['todas','Todas']];
function filtraSol(s, st){
  if (st==='todas') return true;
  if (st==='abertas') return s.aberta;
  if (st==='avisar') return s.faltaAvisar;
  return s.st.k===st;
}
function vSols(){
  const f=S.solFiltro, cats=categorias();
  const base = S.M.sols.filter(s=>f.cat==='TODAS'||s.categoria===f.cat);
  const q = norm(f.q||'');
  const list = base.filter(s=>filtraSol(s,f.st)).filter(s=>{
    if (!q) return true;
    const hay = norm([pad4(s.num), s.num, s.solicitante, s.email, s.obs, s.compras?.num, ...s.linhas.map(l=>l.cod+' '+l.desc+' '+l.pc)].join(' '));
    return q.split(/\s+/).every(t=>hay.includes(t));
  });
  const stats = FILTROS_SOL.map(([v,t])=>{ const n=base.filter(s=>filtraSol(s,v)).length;
    return `<button class="stat ${v==='avisar'&&n?'alert':''}" aria-pressed="${f.st===v}" data-act="f-sol" data-v="${v}"><b>${n}</b><span>${t}</span></button>`; }).join('');
  const body = list.map(s=>`<tr class="click" data-act="abrir-sol" data-id="${esc(s.id)}">
    <td class="mono"><b>${numTxt(s)}</b>${s.urgente?' <span class="pill p-bad">Urgente</span>':''}</td><td>${fD(s.data)}</td><td>${esc(s.categoria)}</td>
    <td>${[...new Set(s.linhas.map(l=>l.pc))].map(p=>`<span class="tag">${esc(p)}</span>`).join(' ')}</td>
    <td>${esc(s.solicitante||'')}</td><td class="num">${s.linhas.length}</td><td class="num">${fR(s.tot)}</td><td class="num">${s.totPend>0.0001 && s.status==='enviada'?fR(s.totPend):'—'}</td>
    <td><span class="pill ${s.st.c}">${s.st.t}</span>${s.faltaAvisar?' <span class="pill p-bad">Avisar</span>':''}</td>
    <td class="mono">${esc(s.compras?.num||'—')}</td><td>${s.compras?.previsao?fD(s.compras.previsao):'—'}</td></tr>`).join('');
  return `
  <div class="spread"><div><h1>Solicitações de entrega</h1><p class="sub">Cada solicitação é um pedido de fornecimento dentro do contrato: almoxarifado → Compras → fornecedor → chegada.</p></div>
  <button class="btn pri" data-go="nova">+ Nova solicitação</button></div>
  <div class="stats">${stats}</div>
  <div class="panel row" style="gap:14px">
    <input id="s-q" type="search" placeholder="Buscar nº, solicitante, código, produto ou nº do Compras" value="${esc(f.q)}" data-act="s-q" style="flex:1;min-width:220px">
    <select id="s-cat" data-act="s-cat" aria-label="Contrato"><option value="TODAS">Todos os contratos</option>${cats.map(c=>`<option ${f.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
  </div>
  <div class="panel flush"><div class="tbl-wrap">${list.length?`<table><thead><tr><th>Nº</th><th>Data</th><th>Contrato</th><th>PCs</th><th>Solicitante</th><th class="num">Itens</th><th class="num">Valor</th><th class="num">A receber</th><th>Situação</th><th>Nº Compras</th><th>Previsão</th></tr></thead><tbody>${body}</tbody></table>`:`<div class="empty">Nenhuma solicitação com esses filtros.</div>`}</div></div>`;
}

      ${ADM() && s.status==='enviada' && s.totPend>0.0001?`<button class="btn pri" data-act="receber" data-id="${esc(s.id)}">Registrar recebimento</button>`:''}
      ${!ADM() && s.status==='aguardando' && S.config.emailAlmox?`<button class="btn" data-act="avisar-almox" data-id="${esc(s.id)}">Avisar o almoxarifado por e-mail</button>`:''}
    </div></div>
  <article class="doc">

        <div class="muted">Contrato ${esc(s.categoria)} · Filial 0201 · Armazém 41 - AR. PADRÃO AW</div></div>
      <div class="grid" style="gap:4px;justify-items:end;text-align:right">
        <span class="pill ${s.st.c}">${s.st.t}</span>${s.urgente?'<span class="pill p-bad">Entrega urgente</span>':''}
        <span>Data: <b>${fD(s.data)}</b></span>${s.enviadaEm?`<span class="muted">Enviada ao Compras em ${fD(s.enviadaEm)}</span>`:''}

        ${s.email||s.zap?`<span class="muted">${[s.email,s.zap].filter(Boolean).map(esc).join(' · ')}</span>`:''}

    </div>
    ${blocos}
    <div class="kv">
      <div><span class="label">Total do pedido</span><span class="big">${fR(s.tot)}</span></div>
      <div><span class="label">Condição de pagamento</span><span>${esc(condPag(s.tot))}</span></div>
      <div><span class="label">Recebido</span><span class="big">${fR(s.totRec)}</span></div>
      <div><span class="label">Falta receber</span><span class="big" style="color:var(--warn)">${fR(ativa?s.totPend:0)}</span></div>
    </div>
    ${s.obs?`<div><span class="label">Observação</span><p style="margin:2px 0 0">${esc(s.obs)}</p></div>`:''}

  ${boxRetorno(s)}

  <section class="grid" style="gap:10px"><h2>Recebimentos desta solicitação</h2>
    <div class="panel flush"><div class="tbl-wrap">${recs.length?`<table><thead><tr><th>Data</th><th>NF</th><th>Origem</th><th class="num">Itens</th><th>Observação</th></tr></thead><tbody>
    ${recs.map(r=>`<tr><td>${fD(r.data)}</td><td class="mono">${esc(r.nf||'—')}</td><td>${origemTxt(r.origem)}</td><td class="num">${(r.itens||[]).length}</td><td class="muted">${esc(r.obs||'')}</td></tr>`).join('')}
    </tbody></table>`:`<div class="empty">Nada recebido ainda.</div>`}</div></div></section>
  ${ADM()?`<div class="row">
    ${s.status==='enviada' && s.totPend>0.0001?`<button class="btn" data-act="encerrar-sol" data-id="${esc(s.id)}">Encerrar o que falta</button>`:''}
    ${s.status==='encerrada'?`<button class="btn" data-act="reabrir-sol" data-id="${esc(s.id)}">Reabrir pendências</button>`:''}
    ${ativa && s.qtdRec===0?`<button class="btn danger" data-act="cancelar-sol" data-id="${esc(s.id)}">Cancelar solicitação</button>`:''}

}
// ---------- retorno do Compras ----------
function boxRetorno(s){
  if (['rascunho','aguardando','cancelada'].includes(s.status) && !s.compras) return '';
  const c = s.compras;
  const resumo = c ? `<div class="kv">
      <div><span class="label">Nº informado pelo Compras</span><b class="mono">${esc(c.num||'—')}</b></div>
      <div><span class="label">Pedido ao fornecedor em</span><b>${fD(c.data)}</b></div>
      <div><span class="label">Previsão de entrega</span><b>${c.previsao?fD(c.previsao):'—'}</b></div>
      ${c.obs?`<div><span class="label">Observação</span><b>${esc(c.obs)}</b></div>`:''}</div>` : '';
  if (!ADM()) return c ? `<section class="box done"><h3>Retorno do Compras</h3>${resumo}</section>` : `<section class="box"><h3>Retorno do Compras</h3><p class="muted" style="margin:0">O Compras ainda não informou o pedido ao fornecedor.</p></section>`;
  const editando = !c || S.rtEdit===s.id;
  if (!editando) return `<section class="box done"><h3>Retorno do Compras <span class="pill p-ok">Registrado</span></h3>${resumo}<div><button class="btn sm" data-act="rt-editar" data-id="${esc(s.id)}">Editar retorno</button></div></section>`;
  return `<section class="box"><h3>Retorno do Compras</h3>
    <p class="muted" style="margin:0">Quando o Compras confirmar que pediu a entrega ao fornecedor, registre aqui. A situação passa para <b>Solicitada ao fornecedor</b> e você pode avisar o solicitante.</p>
    <div class="fields">
      <div class="field"><label class="label" for="rt-num">Nº informado pelo Compras</label><input id="rt-num" value="${esc(c?.num||'')}" placeholder="Ex.: AE 1234 ou protocolo"></div>
      <div class="field"><label class="label" for="rt-data">Pedido ao fornecedor em</label><input id="rt-data" type="date" value="${esc(c?.data||today())}"></div>
      <div class="field"><label class="label" for="rt-prev">Previsão de entrega</label><input id="rt-prev" type="date" value="${esc(c?.previsao||'')}"></div>
      <div class="field"><label class="label" for="rt-obs">Observação</label><input id="rt-obs" value="${esc(c?.obs||'')}" placeholder="Ex.: fornecedor entrega em 2 lotes"></div>
    </div>
    <div class="row"><button class="btn pri" data-act="rt-salvar" data-id="${esc(s.id)}">Salvar retorno do Compras</button>${c?`<button class="btn" data-act="rt-cancel">Cancelar</button>`:''}</div></section>`;
}
// ---------- aviso ao solicitante ----------
const ETAPA_TXT = {retorno:'enviada ao fornecedor', parcial:'chegou parcialmente', entrega:'chegou ao almoxarifado'};
const VIA_TXT = {email:'E-mail', whatsapp:'WhatsApp', outro:'Outro meio'};
function saudacao(){ const h=new Date().getHours(); return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'; }
const cap = w => w ? w.charAt(0).toUpperCase()+w.slice(1).toLowerCase() : '';
function listaItens(ls, campo){ const L=ls.slice(0,30).map((l,i)=>`${i+1}. ${l.cod} - ${l.desc} - QTD: ${fQ(l[campo])} ${l.un}`); if (ls.length>30) L.push(`... e mais ${ls.length-30} itens.`); return L.join('\n'); }
function assuntoAviso(s){ return `Solicitação de entrega Nº ${numTxt(s)} - ${ETAPA_TXT[s.etapa]||''}`; }
function textoAviso(s){
  const nome = cap(String(s.solicitante||'').trim().split(/\s+/)[0]); const c=s.compras||{};
  const abre = `${saudacao()}${nome?', '+nome:''}!`;
  const ref = `Sua solicitação de entrega Nº ${numTxt(s)} (contrato ${s.categoria}), de ${fD(s.data)}`;
  const fim = `

Atenciosamente,
${S.config.assinatura||''}`.trimEnd();
  if (s.etapa==='entrega') return `${abre}

${ref}, chegou ao almoxarifado e está disponível para retirada.

Itens:
${listaItens(s.linhas,'qtd')}${fim}`;
  if (s.etapa==='parcial') return `${abre}

${ref}, chegou parcialmente ao almoxarifado. Os itens que chegaram já estão disponíveis para retirada.

Já chegou:
${listaItens(s.linhas.filter(l=>l.rec>0),'rec')}

Ainda falta:
${listaItens(s.linhas.filter(l=>l.pend>0),'pend')}

Avisaremos quando o restante chegar.${fim}`;
  return `${abre}

${ref}, foi enviada ao fornecedor pelo setor de Compras.${c.num?`
Nº informado pelo Compras: ${c.num}`:''}${c.previsao?`
Previsão de entrega: ${fD(c.previsao)}`:''}

Itens:
${listaItens(s.linhas,'qtd')}

Avisaremos quando chegar ao almoxarifado.${fim}`;
}
function waHref(fone, texto){ let d=String(fone||'').replace(/\D/g,''); if (d.length===10||d.length===11) d='55'+d; return 'https://wa.me/'+d+'?text='+encodeURIComponent(texto); }
function linksAviso(){
  const em=$('#av-email')?.value.trim()||'', zap=$('#av-zap')?.value.trim()||'', tx=$('#av-texto')?.value||'', as=$('#av-assunto')?.value||'';
  const m=$('#av-mail'), w=$('#av-wa');
  if (m){ m.href = linkOutlook(S.config.outlookModo||'app', em, as, tx); m.toggleAttribute('aria-disabled', !em); m.classList.toggle('off', !em); }
  if (w){ w.href = waHref(zap, tx); w.classList.toggle('off', zap.replace(/\D/g,'').length<10); }
}
function boxAviso(s){
  if (!ADM()) return '';
  const log = s.avisos.length ? `<ul class="log">${s.avisos.map(a=>`<li>${VIA_TXT[a.via]||a.via} · ${ETAPA_TXT[a.etapa]||a.etapa} · ${new Date(a.em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</li>`).join('')}</ul>` : '';
  if (!s.etapa) return log ? `<section class="box"><h3>Avisos ao solicitante</h3>${log}</section>` : '';
  const feito = !s.faltaAvisar && s.contato;
  return `<section class="box ${feito?'done':''}"><h3>Avisar o solicitante <span class="pill ${feito?'p-ok':'p-warn'}">${feito?'Avisado':'Falta avisar'}</span><span class="muted" style="font-weight:400;font-family:var(--f-body);font-size:13px">Etapa: ${ETAPA_TXT[s.etapa]}</span></h3>
    <div class="fields">
      <div class="field"><label class="label" for="av-email">E-mail</label><input id="av-email" type="email" value="${esc(s.email||'')}" data-act="av-campo" placeholder="e-mail do solicitante"></div>
      <div class="field"><label class="label" for="av-zap">WhatsApp</label><input id="av-zap" type="tel" value="${esc(s.zap||'')}" data-act="av-campo" placeholder="(64) 99999-9999"></div>
      <div class="field" style="grid-column:1/-1"><label class="label" for="av-assunto">Assunto do e-mail</label><input id="av-assunto" value="${esc(assuntoAviso(s))}" data-act="av-campo"></div>
    </div>
    <div class="field"><label class="label" for="av-texto">Mensagem</label><textarea id="av-texto" class="mailbody" data-act="av-campo" style="min-height:180px">${esc(textoAviso(s))}</textarea></div>
    <div class="row">
      <a class="btn pri" id="av-mail" href="#" target="_blank" rel="noopener" data-act="av-enviar" data-via="email" data-id="${esc(s.id)}">Abrir e-mail no Outlook</a>
      <a class="btn wa" id="av-wa" href="#" target="_blank" rel="noopener" data-act="av-enviar" data-via="whatsapp" data-id="${esc(s.id)}">Enviar pelo WhatsApp</a>
      <button class="btn" data-act="av-enviar" data-via="outro" data-id="${esc(s.id)}">Avisei por outro meio</button>
    </div>
    ${log}</section>`;
}
function recPorPc(r){
  const g={}; (r.itens||[]).forEach(l=>(g[l.pc] ||= []).push(l));
  let total=0;
  const blocos = Object.keys(g).sort().map(pc=>{
    const c=S.contratos[pc]||{}; let sub=0;
    const linhas=g[pc].map(l=>{ const it=S.M.items[key(l.pc,l.cod)]||{}; const v=l.qtd*(it.vunit||0); sub+=v;
      return `<tr><td class="mono">${esc(l.cod)}</td><td class="desc">${esc(it.desc||'')}</td><td class="num">${fQ(l.qtd)} ${esc(it.un||'')}</td><td class="num">${fR(it.vunit)}</td><td class="num">${fR(v)}</td></tr>`; }).join('');
    total+=sub;
    return `<div class="forn"><h3><span class="mono">PC ${esc(pc)}</span> ${esc(c.fornecedor||'')} ${c.codFornecedor?`<span class="tag">cód. ${esc(c.codFornecedor)}</span>`:''}</h3>
      <div class="tbl-wrap"><table><thead><tr><th>Código</th><th>Descrição</th><th class="num">Qtd.</th><th class="num">V. unit.</th><th class="num">Total</th></tr></thead><tbody>${linhas}</tbody>
      <tfoot><tr><td colspan="2">${g[pc].length} ite${g[pc].length>1?'ns':'m'} · subtotal ${esc(shortForn(c.fornecedor||''))}</td><td colspan="3" class="num">${fR(sub)}</td></tr></tfoot></table></div></div>`;
  }).join('');
  return blocos + (Object.keys(g).length>1?`<div class="row" style="justify-content:flex-end"><span class="label">Total do recebimento</span><b class="num">${fR(total)}</b></div>`:'');
}
const origemTxt = o => ({'erp-inicial':'<span class="pill p-draft">Carga inicial ERP</span>','erp':'<span class="pill p-acc">ERP</span>','app':'<span class="pill p-ok">Lançado no app</span>'}[o] || esc(o||''));

        <div style="text-align:right"><div class="label">${rows.length} recebimento${rows.length>1?'s':''}</div><div class="big" style="font-size:21px">${fR(tot)}</div></div></div>
      <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>NF</th><th>Solicitação</th><th>Origem</th><th class="num">Itens</th><th class="num">Valor</th><th>Observação</th></tr></thead><tbody>

async function salvarSol(modo){
  const d=S.draft;
  const itens = Object.entries(d.qtd).filter(([k,v])=>v>0 && S.M.items[k]).map(([k,v])=>({pc:S.M.items[k].pc, cod:S.M.items[k].cod, qtd:r2(v)}));
  if (!itens.length) return;
  const editando = d.id ? S.sols[d.id] : null;
  let id=d.id, num=d.num;
  if (!editando){ num=await nextSeq(); id='s'+pad4(num); while (S.sols[id]) { num++; id='s'+pad4(num); } }
  const prev = editando ? {...editando} : {}; const autor = prev.autor; delete prev.id; delete prev.autor;
  const doc = {...prev, num, data:d.data||today(), categoria:d.categoria, solicitante:(d.solicitante||'').trim(), email:(d.email||'').trim(), zap:(d.zap||'').trim(),
    obs:d.obs||'', urgente:!!d.urgente, itens, criadaEm: prev.criadaEm || new Date().toISOString(), atualizadaEm:new Date().toISOString()};
  if (ADM()){
    if (editando && autor){ doc.status = prev.status||'aguardando'; await setRef(solRef(id), doc); if (modo==='enviada') await setStatus(id,'enviada',{enviadaEm:today()}); }
    else { doc.status = modo; doc.enviadaEm = modo==='enviada' ? (prev.enviadaEm||today()) : null; await setRef(solRef(id), doc); }
  } else {
    if (!S.uid){ S.role='viewer'; applyRole(); render(true); toast('Não foi possível identificar você. Use Enviar ao almoxarifado pelo Outlook.'); return; }
    if (!S.marker){ await setRef(S.db.collection('solicitacoes').doc(S.uid), {tipo:'usuario', em:Date.now()}); S.marker=true; watchUser(S.uid); }
    const ref=S.db.collection('solicitacoes').doc(S.uid).collection('itens').doc(id);
    doc.status='aguardando'; doc.enviadaEm=null;
    await setRef(ref, doc); REFS[id]=ref;
  }
  LS.set('solicitante', d.solicitante||''); LS.set('solEmail', d.email||''); LS.set('solZap', d.zap||''); LS.set('cat', d.categoria);
  S.draft=null;
  toast(modo==='enviada'?`Solicitação ${pad4(num)} salva. Agora envie ao Compras.`: modo==='aguardando'?`Solicitação ${pad4(num)} enviada ao almoxarifado.`:`Rascunho ${pad4(num)} salvo.`);
  go('sol', id);
  if (modo==='enviada') { let t=0; const abre=()=>{ if (S.M.solById[id]) abrirEnvio(id); else if (++t<20) setTimeout(abre,150); }; abre(); }
}

function xc(ws, ref, v, o={}){

  for (const [pc, ls] of Object.entries(grupos)){

// FIFO: lança como recebido a diferença ERP − app, primeiro nas solicitações mais antigas
function planoSync(pcs){
  const porSol={}, avulso={};
  const solsAb = S.M.sols.filter(s=>s.status==='enviada').sort((a,b)=>a.num-b.num);
  for (const it of Object.values(S.M.items)){
    if (pcs && !pcs.includes(it.pc)) continue;
    let left = r2(it.erp - it.recebido); if (left<=0) continue;
    for (const s of solsAb){ const p=s.linhas.find(l=>l.k===it.k); if (!p||p.pend<=0) continue; const a=Math.min(left,p.pend); left=r2(left-a); (porSol[s.id] ||= []).push({pc:it.pc,cod:it.cod,qtd:r2(a)}); if (left<=0) break; }
    if (left>0) (avulso[it.cat] ||= []).push({pc:it.pc,cod:it.cod,qtd:left});
  }
  return {porSol, avulso};
}
async function executaSync(pcs){
  const {porSol, avulso} = planoSync(pcs); let n=0;
  for (const [sol,itens] of Object.entries(porSol)){ await write('recebimentos', uid('r'), {data:today(), nf:'', sol, origem:'erp', obs:'Diferença da Qtd. atendida do ERP', itens}); n++; }
  for (const [cat,itens] of Object.entries(avulso)){ await write('recebimentos', uid('r'), {data:today(), nf:'', sol:null, origem:'erp', obs:`Diferença da Qtd. atendida do ERP sem solicitação aberta (${cat})`, itens}); n++; }
  return n;
}

// importação
const norm = s => String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[.\s]+$/,'').replace(/\s+/g,' ').trim();
async function lerArquivo(file){
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf,{type:'array'});
    let rows=null, hi=-1;
    for (const sn of wb.SheetNames){ const r=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''}); const i=r.findIndex(x=>x.some(v=>norm(v)==='numero pc') && x.some(v=>norm(v)==='cod. produto'||norm(v)==='cod produto')); if (i>=0){ rows=r; hi=i; break; } }
    if (!rows) { toast('Não achei as colunas "Número PC" e "Cód. Produto" nessa planilha.'); return; }
    const H = rows[hi].map(norm); const col = (...names) => { for (const n of names){ const i=H.indexOf(n); if (i>=0) return i; } return -1; };
    const C = {pc:col('numero pc'), cod:col('cod. produto','cod produto'), desc:col('descricao produto','descricao do produto'), un:col('unidade de medida','un'), qtd:col('quantidade'), at:col('quantidade atendida'),
      vu:col('valor unitario'), forn:col('fornecedor'), cforn:col('codigo fornecedor'), comp:col('comprador'), sc:col('numero sc'), em:col('emissao'), fil:col('filial'), arm:col('armazem'), leg:col('legenda')};
    if (C.qtd<0 || C.vu<0) { toast('Faltam as colunas Quantidade ou Valor Unitário.'); return; }
    const g = v => v<0 ? '' : v; const pcs={};
    for (const r of rows.slice(hi+1)){
      const pc=String(r[C.pc]??'').trim(), cod=String(r[C.cod]??'').trim(); if (!pc||!cod) continue;
      const exist=S.contratos[pc];
      const c = pcs[pc] ||= {pc, categoria: exist?.categoria || (cod.startsWith('75')?'LIMPEZA':cod.startsWith('79')?'EPI':'OUTROS'), fornecedor:String(r[g(C.forn)]??'').trim(), codFornecedor:String(r[g(C.cforn)]??'').trim(),
        comprador:String(r[g(C.comp)]??'').trim(), sc:String(r[g(C.sc)]??'').trim(), emissao:fmtEm(r[g(C.em)]), filial:String(r[g(C.fil)]??'').trim(), armazem:String(r[g(C.arm)]??'').trim(), atualizadoEm:today(), itens:[]};
      c.itens.push({cod, desc:String(r[g(C.desc)]??'').replace(/\s+/g,' ').trim(), un:String(r[g(C.un)]??'').trim(), qtd:r2(parseNum(r[C.qtd])), vunit:r2(parseNum(r[C.vu])), atendidaErp: C.at>=0? r2(parseNum(r[C.at])):0, legenda:String(r[g(C.leg)]??'').trim()});
    }
    const list = Object.values(pcs).map(c=>{
      const ex=S.contratos[c.pc]; const ch={novos:0,removidos:0,qtd:0,preco:0,atend:0,atendQ:0};
      if (ex){ const m=Object.fromEntries(ex.itens.map(i=>[i.cod,i])); const nm=new Set(c.itens.map(i=>i.cod));
        for (const i of c.itens){ const o=m[i.cod]; if(!o){ch.novos++; continue;} if (o.qtd!==i.qtd) ch.qtd++; if (o.vunit!==i.vunit) ch.preco++; }
        for (const i of ex.itens) if (!nm.has(i.cod)) { ch.removidos++; c.itens.push({...i}); }
      }
      for (const i of c.itens){ const it=S.M.items[key(c.pc,i.cod)]; const d=r2(i.atendidaErp - (it?it.recebido:0)); if (d>0){ ch.atend++; ch.atendQ+=d; } }
      return {pc:c.pc, c, novo:!ex, changes:ch};
    });
    if (!list.length){ toast('Nenhuma linha de pedido encontrada.'); return; }
    S.imp = {nome:file.name, pcs:list, sync:true}; render(true);
  }catch(e){ console.error(e); toast('Não consegui ler esse arquivo.'); }
}
function fmtEm(v){ if (typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return d?`${String(d.d).padStart(2,'0')}/${String(d.m).padStart(2,'0')}/${d.y}`:String(v); } return String(v??'').trim(); }

    case 'f-sol-go': S.solFiltro={st:a.dataset.v, q:'', cat:'TODAS'}; go('solicitacoes'); break;
    case 'item': itemHist(a.dataset.k); break;
    case 'nova-de-saldo': { const cat = S.saldoFiltro.cat!=='TODAS' ? S.saldoFiltro.cat : (S.saldoFiltro.pc!=='TODOS'? S.contratos[S.saldoFiltro.pc]?.categoria : null); if (!S.draft || (cat && S.draft.categoria!==cat && !Object.keys(S.draft.qtd).length)) S.draft=novoDraft(cat||undefined); go('nova'); break; }
    case 'abrir-sol': closeModal(); go('sol', id); break;
    case 'd-cat': if (S.draft.categoria!==a.dataset.v){ const tem=Object.values(S.draft.qtd).some(v=>v>0); const troca=()=>{ S.draft.categoria=a.dataset.v; S.draft.qtd={}; render(true); }; if (tem) confirmar('Trocar de contrato?','As quantidades já digitadas serão apagadas.','Trocar',troca,false); else troca(); } break;
    case 'limpar-draft': S.draft=novoDraft(S.draft?.categoria); render(true); break;
    case 'salvar-sol': a.disabled=true; try{ await salvarSol(a.dataset.modo); }catch(err){ a.disabled=false; } break;
    case 'envio-almox': abrirEnvioAlmox(solPrevia()); break;
    case 'avisar-almox': abrirEnvioAlmox(S.M.solById[id]); break;
    case 'exp-previa': if (PREVIA) expSol(PREVIA); break;
    case 'env-almox-go': { const m=$('#env-modo').value; LS.set('modoViewer', m); if (PREVIA) expSol(PREVIA); break; }
    case 'editar-sol': { const s=S.sols[id]; S.draft={id, num:s.num, categoria:s.categoria, qtd:Object.fromEntries((s.itens||[]).map(l=>[key(l.pc,l.cod),l.qtd])), urgente:!!s.urgente, solicitante:s.solicitante||'', email:s.email||'', zap:s.zap||'', obs:s.obs||'', data:s.data||today(), q:'', soSaldo:true}; go('nova'); break; }
    case 'enviar-sol': await setStatus(id,'enviada',{enviadaEm:today()}); toast('Marcada como enviada ao Compras.'); if ($('#modal-root').innerHTML) closeModal(); break;
    case 'cancelar-sol': confirmar('Cancelar solicitação?','As quantidades voltam para o saldo disponível do contrato.','Cancelar solicitação', async()=>{ await setStatus(id,'cancelada'); toast('Solicitação cancelada.'); }); break;
    case 'encerrar-sol': confirmar('Encerrar o que falta?','Use quando o fornecedor não vai entregar o restante. O que falta volta para o saldo disponível; o que já chegou continua registrado.','Encerrar', async()=>{ await setStatus(id,'encerrada',{encerradaEm:today()}); toast('Pendências encerradas.'); }); break;
    case 'reabrir-sol': await setStatus(id,'enviada'); toast('Pendências reabertas.'); break;
    case 'excluir-sol': confirmar('Excluir solicitação?','Ela some do histórico. Não dá para desfazer.','Excluir', async()=>{ await delSol(id); toast('Solicitação excluída.'); go('solicitacoes'); }); break;
    case 'copiar-email': abrirEnvio(id); break;
    case 'env-padrao': { const v=$('#env-para').value.trim(), cc=$('#env-cc').value.trim(), m=$('#env-modo').value; await write('config','geral',{...S.config, emailCompras:v, ccCompras:cc, outlookModo:m}); S.config={...S.config, emailCompras:v, ccCompras:cc, outlookModo:m}; toast('Padrão de envio salvo.'); break; }
    case 'env-outlook': { const s=S.M.solById[id]; expSol(s); if (s.status==='rascunho'||s.status==='aguardando') { setStatus(id,'enviada',{enviadaEm:today()}).then(()=>toast('Solicitação marcada como enviada ao Compras.')).catch(()=>{}); } break; }
    case 'rt-editar': S.rtEdit=id; render(true); break;
    case 'rt-cancel': S.rtEdit=null; render(true); break;
    case 'rt-salvar': { const n=$('#rt-num').value.trim(), dt=$('#rt-data').value||today(), pv=$('#rt-prev').value||'', ob=$('#rt-obs').value.trim();
      a.disabled=true; try{ await patchRet(id,{compras:{num:n.toUpperCase(), data:dt, previsao:pv, obs:ob, em:new Date().toISOString()}}); S.rtEdit=null; toast('Retorno do Compras registrado.'); }catch(err){ a.disabled=false; } break; }
    case 'av-enviar': { const s=S.M.solById[id]; if (!s||!s.etapa) break; const via=a.dataset.via;
      const em=$('#av-email').value.trim(), zap=$('#av-zap').value.trim();
      if ((em!==(s.email||'')) || (zap!==(s.zap||''))) { const d={...S.sols[id], email:em, zap}; delete d.id; delete d.autor; setRef(solRef(id), d).catch(()=>{}); }
      patchRet(id,{avisos:[...(s.avisos||[]), {etapa:s.etapa, via, em:new Date().toISOString()}]}).then(()=>toast(via==='outro'?'Aviso registrado.':'Aviso registrado. Confira o envio no '+(via==='whatsapp'?'WhatsApp':'Outlook')+'.')).catch(()=>{}); break; }
    case 'copiar': copiar(a.dataset.txt); break;
    case 'copiar-mail': { const t=$('#env-corpo'); copiar(t.value, t); break; }
    case 'exp-sol': expSol(S.M.solById[id]); break;
    case 'exp-saldo': expSaldo(); break;
    case 'sync-erp': { const {porSol,avulso}=planoSync(null); const n=Object.keys(porSol).length+Object.keys(avulso).length; confirmar('Lançar recebimentos pelo ERP?', `Vou criar ${n} recebimento${n>1?'s':''} com a diferença entre a Qtd. atendida do ERP e o recebido no app, abatendo primeiro das solicitações mais antigas.`, 'Lançar', async()=>{ const k=await executaSync(null); toast(`${k} recebimento${k>1?'s':''} lançado${k>1?'s':''}.`); }, false); break; }
    case 'receber': abrirRecebimento(id||''); break;
    case 'rf-cat': lerRecForm(); RF.cat=a.dataset.v; desenhaRec(); break;
    case 'rf-salvar': { lerRecForm(); const itens=Object.entries(RF.qtd).filter(([k,v])=>v>0&&S.M.items[k]).map(([k,v])=>({pc:S.M.items[k].pc,cod:S.M.items[k].cod,qtd:r2(v)}));
      if (!itens.length){ toast('Informe a quantidade de pelo menos um item.'); break; }
      a.disabled=true; try{ await write('recebimentos', uid('r'), {data:RF.data||today(), nf:RF.nf.trim(), sol:RF.sol||null, origem:'app', obs:RF.obs.trim(), itens, criadoEm:new Date().toISOString()}); closeModal(); toast('Recebimento registrado.'); }catch(err){ a.disabled=false; } break; }
    case 'ver-rec': { const full={id, ...S.recs[id]}; const pcF=a.dataset.pc; const r=pcF?{...full, itens:(full.itens||[]).filter(l=>l.pc===pcF)}:full; const s=r.sol?S.M.solById[r.sol]:null;
      const outros=[...new Set((full.itens||[]).map(l=>l.pc))].filter(p=>p!==pcF);
      modal(`<div class="spread"><div><div class="label">${fD(r.data)} · NF ${esc(r.nf||'—')}</div><h2>Recebimento ${s?`da solicitação ${pad4(s.num)}`:'sem solicitação'}</h2></div><button class="btn" data-act="modal-close">Fechar</button></div>
      ${recPorPc(r)}
      ${r.obs?`<p class="muted" style="margin:0">${esc(r.obs)}</p>`:''}
      ${pcF && outros.length?`<p class="muted" style="margin:0">Este recebimento também tem itens do PC ${outros.map(esc).join(', ')}, que aparecem no grupo do outro fornecedor.</p>`:''}
      <div class="row" style="justify-content:space-between">${ADM()?`<button class="btn danger" data-act="del-rec" data-id="${esc(id)}">Excluir recebimento</button>`:'<span></span>'}${s?`<button class="btn" data-act="abrir-sol" data-id="${esc(s.id)}">Abrir solicitação</button>`:''}</div>`); break; }
    case 'del-rec': confirmar('Excluir recebimento?', (()=>{ const p=[...new Set((S.recs[id]?.itens||[]).map(l=>l.pc))]; return 'As quantidades deixam de contar como recebidas.' + (p.length>1?` O recebimento inteiro será excluído, incluindo os itens dos PCs ${p.map(esc).join(' e ')}.`:''); })(),'Excluir', async()=>{ await remove('recebimentos', id); toast('Recebimento excluído.'); }); break;
    case 'imp-ok': a.disabled=true; try{ await confirmaImport(); }catch(err){ a.disabled=false; } break;
    case 'imp-cancel': S.imp=null; render(true); break;
    case 'salvar-ajustes': { const cats=$('#a-cats').value.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
      await write('config','geral',{...S.config, limiteParcelamento:parseNum($('#a-lim').value), parcelas:Math.max(1,parseInt($('#a-parc').value)||1), emailCompras:$('#a-mail').value.trim(), ccCompras:$('#a-cc').value.trim(), emailAlmox:$('#a-almox').value.trim(), assinatura:$('#a-assin').value.trim(), outlookModo:$('#a-modo').value, categorias:cats}); toast('Ajustes salvos.'); break; }
  }
});
async function copiar(txt, el){
  try { await navigator.clipboard.writeText(txt); toast('Copiado.'); }
  catch(e){ if (el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Selecionei o texto: use Ctrl+C para copiar.'); }
}
document.addEventListener('input', e=>{
  const a=e.target.closest('[data-act]'); if(!a) return;
  const d=S.draft;
  switch(a.dataset.act){
    case 'f-q': S.saldoFiltro.q=a.value; clearTimeout(S._t); S._t=setTimeout(()=>{ const pos=a.selectionStart; render(true); const n=$('#f-q'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(x){} } },200); break;
    case 'd-busca': d.q=a.value; clearTimeout(S._t); S._t=setTimeout(()=>{ const pos=a.selectionStart; render(true); const n=$('#d-q'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(x){} } },200); break;
    case 'd-q': { const v=parseNum(a.value); if (v>0) d.qtd[a.dataset.k]=v; else delete d.qtd[a.dataset.k];
      a.classList.toggle('err', v>Number(a.dataset.max)+1e-9); const it=S.M.items[a.dataset.k]; const td=document.querySelector(`[data-tot="${CSS.escape(a.dataset.k)}"]`); if (td) td.textContent = v?fR(v*it.vunit):''; atualizaNovaResumoKeep(); break; }
    case 'd-solicitante': d.solicitante=a.value; break;
    case 'd-email': d.email=a.value; break;
    case 'd-zap': d.zap=a.value; break;
    case 'env-campo': linkEnvio(); break;
    case 'av-campo': linksAviso(); break;
    case 's-q': S.solFiltro.q=a.value; clearTimeout(S._t); S._t=setTimeout(()=>{ const pos=a.selectionStart; render(true); const n=$('#s-q'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(x){} } },250); break;
    case 'd-obs': d.obs=a.value; break;
    case 'd-data': d.data=a.value; break;
    case 'rf-q-item': { const v=parseNum(a.value); if (v>0) RF.qtd[a.dataset.k]=v; else delete RF.qtd[a.dataset.k]; break; }
    case 'rf-q': lerRecForm(); RF.q=a.value; clearTimeout(S._t); S._t=setTimeout(()=>{ const pos=a.selectionStart; desenhaRec(); const n=$('#rf-q'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(x){} } },250); break;
    case 'imp-cat': { const p=S.imp.pcs.find(p=>p.pc===a.dataset.pc); if(p) p.c.categoria=a.value; break; }
  }
});
function atualizaNovaResumoKeep(){
  // atualiza o resumo sem perder o foco do campo de quantidade
  const ae=document.activeElement, idf=ae&&ae.id; atualizaNovaResumo(); if (idf && document.getElementById(idf)!==ae) document.getElementById(idf)?.focus();
}
document.addEventListener('change', e=>{
  const a=e.target.closest('[data-act]'); if(!a) return;
  switch(a.dataset.act){
    case 'f-pc': S.saldoFiltro.pc=a.value; render(true); break;
    case 'f-so': S.saldoFiltro.soSaldo=a.checked; render(true); break;
    case 'd-so': S.draft.soSaldo=a.checked; render(true); break;
    case 'd-urg': S.draft.urgente=a.checked; break;
    case 'rf-sol': lerRecForm(); RF.sol=a.value; RF.qtd={}; if (RF.sol){ S.M.solById[RF.sol].linhas.forEach(l=>{ if(l.pend>0) RF.qtd[l.k]=l.pend; }); } desenhaRec(); break;
    case 'imp-file': if (a.files[0]) lerArquivo(a.files[0]); a.value=''; break;
    case 'imp-sync': S.imp.sync=a.checked; break;
    case 's-cat': S.solFiltro.cat=a.value; render(true); break;
    case 'env-campo': linkEnvio(); break;
  }
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && $('#modal-root').innerHTML) closeModal(); });

// ---------- início ----------
function rebuildSols(){ S.sols = {...S.topSols}; for (const m of Object.values(S.userSols)) Object.assign(S.sols, m); }
function watchUser(u){
  if (USERSUB[u]) return;
  const col=S.db.collection('solicitacoes').doc(u).collection('itens');
  USERSUB[u]=col.onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ REFS[d.id]=col.doc(d.id); m[d.id]={...d.data(), id:d.id, autor:u}; }); S.userSols[u]=m; rebuildSols(); onData(); }, err=>console.error('itens', err));
}
function onData(){
  if (!Object.values(S.ready).every(Boolean)) return;
  compute(); render();
}
(async ()=>{
  const h=(location.hash||'').slice(1); if (['painel','saldo','nova','solicitacoes','recebimentos','importar','ajustes'].includes(h)) { S.view=h; if (h==='nova') S.draft=novoDraft(); }
  let claude = window.claude;
  for (let i=0; i<30 && !(claude && claude.use); i++){ await new Promise(r=>setTimeout(r,100)); claude = window.claude; }
  if (!claude || !claude.use){ $('#main').innerHTML='<div class="panel empty"><h2>Abra este app no Claude</h2><p class="sub">Os dados dos contratos ficam guardados na base do app, disponível quando ele é aberto pelo link do Claude.</p></div>'; return; }
  S.dl = await claude.use('downloads').catch(()=>null);
  S.db = await claude.use('db').catch(()=>null);
  if (!S.db){ $('#main').innerHTML='<div class="panel empty"><h2>Base de dados indisponível</h2><p class="sub">Entre na sua conta do Claude e abra o app novamente para ver os contratos.</p></div>'; return; }
  try {
    const u = await claude.use('user');
    if (u){
      const [own, edit, w, me] = await Promise.all([u.isOwner().catch(()=>false), u.canEdit().catch(()=>false), u.can('data.write').catch(()=>null), u.id().catch(()=>null)]);
      S.uid = me || null;
      S.role = (own||edit) ? 'admin' : (w===false ? 'viewer' : 'user');
    }
  } catch(e){}
  applyRole();
  const sub = (col, fn) => S.db.collection(col).onSnapshot(snap=>{ fn(snap); S.ready[col]=true; onData(); }, err=>{ console.error(col, err); S.ready[col]=true; onData(); });
  sub('contratos', snap=>{ S.contratos = Object.fromEntries(snap.docs.map(d=>[d.id, {...d.data(), pc:d.data().pc||d.id}])); });
  sub('solicitacoes', snap=>{ const top={};
    snap.docs.forEach(d=>{ const v=d.data(); if (v && v.tipo==='usuario'){ if (d.id===S.uid) S.marker=true; watchUser(d.id); return; } REFS[d.id]=S.db.collection('solicitacoes').doc(d.id); top[d.id]={...v, id:d.id}; });
    S.topSols=top; rebuildSols(); });
  sub('retorno', snap=>{ S.ret = Object.fromEntries(snap.docs.map(d=>[d.id, d.data()])); });
  sub('recebimentos', snap=>{ S.recs = Object.fromEntries(snap.docs.map(d=>[d.id, d.data()])); });
  sub('config', snap=>{ const g=snap.docs.find(d=>d.id==='geral'); if (g) S.config={...S.config, ...g.data()}; });
})();
})();
</script>
